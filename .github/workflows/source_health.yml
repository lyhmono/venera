name: "source-health"
on:
  workflow_dispatch: {}
  schedule:
    # UTC 02:00 daily (CN 10:00)
    - cron: "0 2 * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save cheerio undici
      - name: Run comic source health check
        run: node scripts/ci_check.js
